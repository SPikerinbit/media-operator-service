services:
  media-api:
    build:
      context: .
    container_name: media-operator-service
    environment:
      MEDIA_ROOT_DIR: /app
      MEDIA_DATA_DIR: /app/data
      MEDIA_BIND_HOST: 127.0.0.1
      PUBLIC_BASE_URL: http://127.0.0.1:8090
      WORKER_CONCURRENCY: 2
      ALLOW_PLACEHOLDER_ARTIFACTS: "false"
      # Set this and change MEDIA_BIND_HOST before publishing the port.
      # MEDIA_API_TOKEN: ""
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - ./data:/app/data
